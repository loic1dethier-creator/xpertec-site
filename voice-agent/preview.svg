<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="bg1" cx="20%" cy="-10%" r="70%">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity="0.16"/><stop offset="1" stop-color="#0b0f17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="95%" cy="0%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/><stop offset="1" stop-color="#0b0f17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Cadre iPhone -->
  <rect x="190" y="15" width="420" height="870" rx="60" fill="#000"/>
  <rect x="200" y="25" width="400" height="850" rx="52" fill="#0b0f17"/>
  <clipPath id="screen"><rect x="200" y="25" width="400" height="850" rx="52"/></clipPath>

  <g clip-path="url(#screen)">
    <rect x="200" y="25" width="400" height="850" fill="#0b0f17"/>
    <rect x="200" y="25" width="400" height="850" fill="url(#bg1)"/>
    <rect x="200" y="25" width="400" height="850" fill="url(#bg2)"/>

    <!-- Encoche -->
    <rect x="345" y="39" width="110" height="26" rx="13" fill="#000"/>

    <!-- Header -->
    <g transform="translate(220,90)">
      <rect x="0" y="0" width="32" height="32" rx="10" fill="url(#acc)"/>
      <text x="42" y="14" fill="#e6edf6" font-size="16" font-weight="800">Agent Vocal IA</text>
      <text x="42" y="30" fill="#9aa4b2" font-size="11" font-weight="600">Appuyez sur le micro pour parler</text>
      <!-- icône corbeille -->
      <rect x="288" y="-2" width="36" height="36" rx="11" fill="#ffffff10" stroke="#ffffff1f"/>
      <g stroke="#cdd6e2" stroke-width="1.6" fill="none">
        <rect x="299" y="13" width="14" height="14" rx="2"/>
        <line x1="296" y1="11" x2="316" y2="11"/>
        <line x1="304" y1="9" x2="308" y2="9"/>
        <line x1="303" y1="16" x2="303" y2="24"/><line x1="309" y1="16" x2="309" y2="24"/>
      </g>
      <!-- icône engrenage -->
      <rect x="330" y="-2" width="36" height="36" rx="11" fill="#ffffff10" stroke="#ffffff1f"/>
      <g stroke="#cdd6e2" stroke-width="1.6" fill="none">
        <circle cx="348" cy="16" r="4.2"/>
        <circle cx="348" cy="16" r="8.2" stroke-dasharray="2.2 2.6"/>
      </g>
    </g>
    <line x1="200" y1="140" x2="600" y2="140" stroke="#ffffff14"/>

    <!-- Conversation -->
    <g transform="translate(250,166)">
      <rect x="0" y="0" width="330" height="64" rx="16" fill="url(#bub)" stroke="#ffffff1f"/>
      <text x="16" y="22" fill="#9aa4b2" font-size="11" font-weight="700">Vous</text>
      <text x="16" y="46" fill="#eef3fa" font-size="14.5">Appelle Marie et préviens-la que j'arrive.</text>
    </g>
    <g transform="translate(220,244)">
      <rect x="0" y="0" width="300" height="64" rx="16" fill="#1a2434" stroke="#ffffff1f"/>
      <text x="16" y="22" fill="#9aa4b2" font-size="11" font-weight="700">Agent</text>
      <text x="16" y="46" fill="#eef3fa" font-size="14.5">D'accord, j'appelle Marie tout de suite.</text>
    </g>
    <g transform="translate(260,322)">
      <path d="M154 4 l-7 9 h5 l-3 8 8 -10 h-5 z" fill="#6ee7ff"/>
      <text x="172" y="14" fill="#9aa4b2" font-size="12.5">Appel lancé vers Marie</text>
    </g>
    <g transform="translate(290,350)">
      <rect x="0" y="0" width="290" height="64" rx="16" fill="url(#bub)" stroke="#ffffff1f"/>
      <text x="16" y="22" fill="#9aa4b2" font-size="11" font-weight="700">Vous</text>
      <text x="16" y="46" fill="#eef3fa" font-size="14.5">Lance mon Raccourci « Mode nuit ».</text>
    </g>
    <g transform="translate(220,428)">
      <rect x="0" y="0" width="320" height="86" rx="16" fill="#1a2434" stroke="#ffffff1f"/>
      <text x="16" y="22" fill="#9aa4b2" font-size="11" font-weight="700">Agent</text>
      <text x="16" y="46" fill="#eef3fa" font-size="14.5">C'est parti, j'active le mode nuit. Bonne</text>
      <text x="16" y="68" fill="#eef3fa" font-size="14.5">soirée !</text>
    </g>
    <g transform="translate(255,528)">
      <path d="M118 4 l-7 9 h5 l-3 8 8 -10 h-5 z" fill="#6ee7ff"/>
      <text x="136" y="14" fill="#9aa4b2" font-size="12.5">Raccourci « Mode nuit » lancé</text>
    </g>

    <!-- Composer -->
    <line x1="200" y1="680" x2="600" y2="680" stroke="#ffffff14"/>
    <text x="400" y="706" fill="#6ee7ff" font-size="13" text-anchor="middle" font-weight="600">J'écoute…</text>

    <!-- Mic button (état écoute) -->
    <circle cx="400" cy="760" r="54" fill="none" stroke="#fb718566" stroke-width="3"/>
    <circle cx="400" cy="760" r="44" fill="url(#danger)"/>
    <rect x="388" y="748" width="24" height="24" rx="6" fill="#ffffff"/>

    <text x="400" y="828" fill="#9aa4b2" font-size="11.5" text-anchor="middle">Tapez pour parler · re-tapez pour arrêter</text>

    <!-- Champ texte -->
    <g transform="translate(224,842)">
      <rect x="0" y="0" width="276" height="42" rx="14" fill="#00000040" stroke="#ffffff1f"/>
      <text x="14" y="26" fill="#9aa4b2" font-size="14">…ou écrivez ici</text>
      <rect x="286" y="0" width="66" height="42" rx="14" fill="#ffffff12" stroke="#ffffff1f"/>
      <text x="319" y="26" fill="#eef3fa" font-size="13.5" font-weight="800" text-anchor="middle">Envoyer</text>
    </g>
  </g>
</svg>
